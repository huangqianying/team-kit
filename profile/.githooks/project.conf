# .githooks/project.conf —— 本工程专属的提交门禁配置（由 .githooks/pre-commit source）。
# 内核脚本各工程逐字相同；这里只放本工程的事实，kit 同步不覆盖本文件。
# 正则一律为 Python re 语法，用 re.search 匹配仓库相对路径；变量全部可选，留空即用内核默认。

# 凭据文件（命中即拒；以 .example 结尾的模板不拦）。按本工程 .gitignore 的凭据段填写，例如部署凭据文件。
HOOK_CRED_FILE_RE=''

# 追加的测试路径（豁免口令内容扫描）。内核已豁免 tests/、test/、*.test.*、*.spec.*、test_*、*_test.*。
HOOK_TEST_PATH_RE=''

# 追加的配置类路径（连裸值一起扫）。内核已覆盖 .env/.ini/.conf/.yaml/.toml/.properties/.sh/Dockerfile/.npmrc 等。
HOOK_CONFIG_PATH_RE=''

# 业务取值白名单（口令字段的值整体匹配即放行），例如业务里名为 token 的统计字段取值。无则留空。
HOOK_SECRET_ALLOW_VALUE_RE=''

# 拒绝时附加的一行指引（凭据应放在哪、怎么读取）。
HOOK_CRED_HINT=''
