# .githooks/project.conf —— 本工程专属的提交门禁配置（由 .githooks/pre-commit source）。
# 内核脚本各工程逐字相同；这里只放本工程的事实，kit 同步不覆盖本文件。
# 正则一律为 Python re 语法，用 re.search 匹配仓库相对路径；变量全部可选，留空即用内核默认。

# 凭据文件（命中即拒；以 .example 结尾的模板不拦）。依据 .gitignore 的凭据段：
#   部署凭据 .deploy/credentials.ini。backend/.env 系列由内核通用的 .env 规则拦。
HOOK_CRED_FILE_RE='(^|/)\.deploy/credentials\.ini$'

# 追加的测试路径（豁免口令内容扫描）。内核已豁免 tests/、test/、*.test.*、*.spec.*、test_*、*_test.*，
# 覆盖 backend/tests/、frontend/tests/、frontend/src/test/ 与 frontend 下的 *.test.ts。
HOOK_TEST_PATH_RE=''

# 追加的配置类路径（连裸值一起扫）。内核已覆盖 .env/.ini/.conf/.yaml/.toml/.properties/.sh/Dockerfile/.npmrc 等。
HOOK_CONFIG_PATH_RE=''

# 业务取值白名单（口令字段的值整体匹配即放行）：
#   仪表盘 Token 指标的枚举取值（frontend 里 token 字段取 total_tokens / total_input_tokens /
#   total_output_tokens），是指标名不是令牌。
HOOK_SECRET_ALLOW_VALUE_RE='total_(input_|output_)?tokens'

# 拒绝时附加的一行指引。
HOOK_CRED_HINT='部署凭据只放 .deploy/credentials.ini，后端运行配置只放 backend/.env（均不入库，读取方式见 skills/deploy-aitokenreport）；入库模板是 .deploy/credentials.ini.example 与 backend/.env.example，不得填真值。'
